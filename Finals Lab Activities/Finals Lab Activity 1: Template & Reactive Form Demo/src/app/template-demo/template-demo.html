<div class="container">
  <h2>{{ title }}</h2>
  <form (ngSubmit)="onSubmit()" #myForm="ngForm">
    <input class="input-box" type="text" name="username" [(ngModel)]="username" placeholder="Enter username" required>

    <input class="input-box" type="email" name="email" [(ngModel)]="email" placeholder="Enter email" required email>

    <input class="input-box" type="password" name="password" [(ngModel)]="password" placeholder="Enter password" required minlength="6">

    <select class="input-box" name="role" [(ngModel)]="role" required>
      <option value="" disabled selected>Select role</option>
      <option value="admin">Admin</option>
      <option value="user">User</option>
      <option value="guest">Guest</option>
    </select>

    <div class="radio-group">
      <label><input type="radio" name="gender" [(ngModel)]="gender" value="Male" required> Male</label>
      <label><input type="radio" name="gender" [(ngModel)]="gender" value="Female"> Female</label>
    </div>

    <div class="radio-group">
      <label><input type="radio" name="status" [(ngModel)]="status" value="Permanent" required> Permanent</label>
      <label><input type="radio" name="status" [(ngModel)]="status" value="Probationary"> Probationary</label>
    </div>

    <textarea class="input-box" name="comments" [(ngModel)]="comments" placeholder="Notes..."></textarea>

    <input class="btn" type="submit" value="Submit" [disabled]="!myForm.valid">
  </form>

  <div *ngIf="submitted" class="success-msg">
    <h3>Submission Successful!</h3>
    <p>Welcome, {{ username }}</p>
  </div>
</div>
