<div class="card">
  <h2>Project Support Ticket</h2>
  <form [formGroup]="feedbackForm" (ngSubmit)="onSubmit()">

    <label>Project Name</label>
    <input class="input" formControlName="projectName" placeholder="Enter project name" />
    <small class="error" *ngIf="isInvalid('projectName')">Project name is required (min 3 chars).</small>

    <label>Contact Phone</label>
    <input class="input" formControlName="contactPhone" placeholder="09123456789" />
    <small class="error" *ngIf="isInvalid('contactPhone')">Enter a valid 10-11 digit phone number.</small>

    <label>Category</label>
    <select class="input" formControlName="priority">
      <option *ngFor="let cat of categories" [value]="cat">{{ cat }}</option>
    </select>

    <div class="group">
      <label>Service Rating (1-5):</label>
      <input type="number" class="input" formControlName="rating" min="1" max="5" />
      <small class="error" *ngIf="isInvalid('rating')">Rate between 1 and 5.</small>
    </div>

    <label>Describe the issue</label>
    <textarea class="input" formControlName="message" placeholder="What's happening?"></textarea>
    <small class="error" *ngIf="isInvalid('message')">Message is required (max 200 chars).</small>

    <button class="btn" type="submit" [disabled]="feedbackForm.invalid">Create Ticket</button>
  </form>
</div>
